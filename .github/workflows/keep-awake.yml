# Render's free plan puts the server to sleep after ~15 minutes without requests,
# and waking it takes up to a minute. Ping /health once an hour.
# Note: GitHub pauses scheduled workflows after 60 days with no commits; re-enable it in the Actions tab.
name: Keep server awake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://viewlens-api.onrender.com/health
